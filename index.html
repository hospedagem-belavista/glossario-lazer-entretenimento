<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossário Lazer e Entretenimento — Hotel Fazenda Bela Vista</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg: #E6DAB8;
  --bg-soft: #EFE5C9;
  --cover: #2A2015;
  --cover-soft: #382C1D;
  --ink: #2A2015;
  --cream: #F3EAD2;
  --rust: #A24E2A;
  --rust-dark: #823C20;
  --green: #45593A;
  --green-dark: #354630;
  --gold: #C99A3D;
  --line: #B8A476;
  --line-soft: #D6C79C;
  --card: #FBF6E9;
  --shadow: rgba(42,32,21,0.18);
  --radius: 10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
  min-height:100vh;
}

::selection{ background: var(--gold); color:var(--cover); }

.display{
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
}

/* ===== HEADER ===== */
header.topbar{
  background: var(--cover);
  background-image: linear-gradient(180deg, var(--cover-soft), var(--cover));
  color: var(--cream);
  padding: 18px 0 0 0;
  border-bottom: 6px solid var(--gold);
  position: sticky;
  top:0;
  z-index: 50;
}
.topbar-inner{
  max-width: 1180px;
  margin: 0 auto;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  padding-left: 24px;
  padding-right: 24px;
}
.logo-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  flex: 0 0 auto;
}
.logo-wrap img{
  height: 52px;
  width:auto;
  display:block;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.title-block{ line-height:1.15; }
.title-block .eyebrow{
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight:600;
  margin-bottom: 2px;
}
.title-block h1{
  font-family:'Bricolage Grotesque', sans-serif;
  font-size: 22px;
  font-weight:700;
  margin: 0;
  letter-spacing: 0.01em;
}
.topbar-actions{
  margin-left:auto;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.search-box{
  position:relative;
  display:flex;
  align-items:center;
}
.search-box input{
  background: rgba(243,234,210,0.1);
  border: 1.5px solid rgba(243,234,210,0.35);
  border-radius: 999px;
  padding: 9px 14px 9px 36px;
  color: var(--cream);
  font-family:'Work Sans',sans-serif;
  font-size:14px;
  width: 230px;
  outline:none;
  transition: all .15s ease;
}
.search-box input::placeholder{ color: rgba(243,234,210,0.55); }
.search-box input:focus{
  background: rgba(243,234,210,0.18);
  border-color: var(--gold);
  width: 280px;
}
.search-box svg{
  position:absolute; left:12px; width:15px; height:15px;
  stroke: rgba(243,234,210,0.7);
}
.btn{
  font-family:'Work Sans',sans-serif;
  font-weight:600;
  font-size: 13px;
  border:none;
  border-radius: 999px;
  padding: 9px 16px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition: transform .1s ease, box-shadow .15s ease;
  white-space:nowrap;
}
.btn:active{ transform: scale(0.96); }
.btn svg{ width:14px; height:14px; }
.btn-edit{
  background: transparent;
  color: var(--cream);
  border: 1.5px solid rgba(243,234,210,0.4);
}
.btn-edit.active{
  background: var(--gold);
  color: var(--cover);
  border-color: var(--gold);
}
.btn-print{
  background: transparent;
  color: var(--cream);
  border: 1.5px solid rgba(243,234,210,0.4);
}
.btn-print:hover{ border-color: var(--cream); }

/* ===== TABS — crate-stencil rolodex style ===== */
.tabs-scroll-wrap{
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.3) transparent;
  -webkit-overflow-scrolling: touch;
  padding: 0 24px;
}
.tabs-scroll-wrap::-webkit-scrollbar{ height: 3px; }
.tabs-scroll-wrap::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.3); border-radius: 2px; }
nav.tabs{
  display:flex;
  gap: 6px;
  padding: 0;
  width: max-content;
}
.tab-btn{
  font-family:'Bricolage Grotesque', sans-serif;
  font-weight:700;
  font-size: 13px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: rgba(243,234,210,0.6);
  background: rgba(0,0,0,0.18);
  border: none;
  border-top: 3px solid transparent;
  padding: 12px 18px 10px 18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  border-radius: 8px 8px 0 0;
  transition: all .15s ease;
}
.tab-btn svg{ width:15px; height:15px; opacity:0.8; flex:0 0 auto; }
.tab-btn:hover{ color: var(--cream); background: rgba(0,0,0,0.1); }
.tab-btn.active{
  color: var(--cover);
  background: var(--bg-soft);
  border-top-color: var(--rust);
}
.tab-btn.active svg{ opacity:1; }

/* ===== MAIN ===== */
main{
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 80px 24px;
}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 2px dashed var(--line);
  padding-bottom: 12px;
}
.section-head h2{
  font-family:'Bricolage Grotesque', sans-serif;
  font-size: 24px;
  margin:0;
  color: var(--rust-dark);
}
.section-head .count{
  font-size: 12px;
  color: var(--ink);
  opacity: 0.55;
  font-weight:500;
}
.add-btn{
  background: var(--green);
  color: var(--cream);
  font-family:'Work Sans',sans-serif;
  font-weight:600;
  font-size:13px;
  border:none;
  border-radius: 999px;
  padding: 8px 16px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.add-btn:hover{ background: var(--green-dark); }
.add-btn svg{ width:14px; height:14px; }

/* highlighted callout cards (rules, carroção, passante) */
.callouts{ display:grid; gap:14px; margin-bottom: 26px; }
.callout{
  background: var(--card);
  border-left: 6px solid var(--rust);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: 0 2px 6px var(--shadow);
  position:relative;
}
.callout .stamp{
  position:absolute;
  top:14px; right:16px;
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color: var(--rust);
  border: 1.5px solid var(--rust);
  border-radius: 999px;
  padding: 3px 9px;
  transform: rotate(-3deg);
  opacity:0.85;
}
.callout h3{
  font-family:'Bricolage Grotesque',sans-serif;
  margin: 0 0 6px 0;
  font-size:16px;
  color: var(--rust-dark);
  padding-right: 90px;
}
.callout .sub{
  font-weight:700;
  color: var(--green-dark);
  font-size: 13px;
  margin-bottom:6px;
}
.callout p{ margin:0; font-size:14px; line-height:1.55; white-space: pre-line; }
.entry-actions{ margin-top:10px; display:flex; gap:8px; }
.mini-btn{
  font-size:12px;
  font-weight:600;
  border:none;
  border-radius:999px;
  padding:5px 12px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.mini-btn svg{width:11px;height:11px;}
.mini-edit{ background: var(--line-soft); color: var(--ink); }
.mini-edit:hover{ background: var(--line); }
.mini-del{ background: #E3CFC3; color: var(--rust-dark); }
.mini-del:hover{ background: #D8B8A8; }
.mini-attach{ background: var(--green); color: var(--cream); }
.mini-attach:hover{ background: var(--green-dark); }

/* grid of normal entry cards */
.cards-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap: 16px;
}
.card{
  background: var(--card);
  border: 1.5px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 16px 16px 14px 16px;
  box-shadow: 0 1px 3px var(--shadow);
  display:flex;
  flex-direction:column;
}
.card h3{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:15px;
  margin:0 0 4px 0;
  color: var(--ink);
}
.card .sub{
  font-size:12px;
  font-weight:700;
  color: var(--rust);
  margin-bottom:8px;
  letter-spacing:0.01em;
}
.card p{
  font-size:13.5px;
  line-height:1.5;
  margin:0;
  color: var(--ink);
  opacity:0.88;
  flex:1;
  white-space: pre-line;
}
.card .entry-actions{ margin-top:12px; }

.empty-state{
  text-align:center;
  padding: 40px 20px;
  color: var(--ink);
  opacity:0.6;
  font-size:14px;
}
.empty-state svg{ width:38px;height:38px; margin-bottom:10px; opacity:0.5; }

/* flowchart */
.flowchart-wrap{
  background: var(--bg-soft);
  border: 1.5px solid var(--line-soft);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 22px;
}
.flowchart-svg{ width:100%; height:auto; display:block; }

/* turnos two-column */
.turnos-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
@media (max-width: 720px){ .turnos-grid{ grid-template-columns: 1fr; } }
.turno-col h3{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color: var(--green-dark);
  border-bottom: 2px solid var(--gold);
  padding-bottom:8px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.turno-list{ display:flex; flex-direction:column; gap:10px; }

/* checklist rows */
.turno-col h3{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.turno-col-actions{ display:flex; align-items:center; gap:8px; }
.progress-pill{
  font-size:11px;
  background: var(--gold);
  color: var(--cover);
  padding:2px 8px;
  border-radius:999px;
  margin-left:8px;
  font-weight:700;
  text-transform:none;
  letter-spacing:0;
}
.reset-btn{
  background: transparent;
  border: 1.5px solid var(--line);
  color: var(--ink);
  border-radius: 999px;
  width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex:0 0 auto;
}
.reset-btn svg{ width:14px;height:14px; }
.reset-btn:hover{ border-color: var(--rust); color: var(--rust); }

.checklist-row{
  background: var(--card);
  border:1.5px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 12px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  transition: all .15s ease;
}
.checklist-row.done{ opacity:0.65; background: var(--bg-soft); }
.check-label{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; }
.check-label input[type=checkbox]{ position:absolute; opacity:0; width:0; height:0; }
.check-box-custom{
  width:22px; height:22px; flex:0 0 auto;
  border:2px solid var(--rust);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  margin-top:1px;
  color: transparent;
  transition: all .15s ease;
}
.check-box-custom svg{ width:13px; height:13px; stroke-width:3; }
.checklist-row.done .check-box-custom{ background: var(--green); border-color: var(--green); color: var(--cream); }
.check-text{ display:flex; flex-direction:column; gap:3px; }
.check-title{ font-weight:700; font-size:14px; }
.checklist-row.done .check-title{ text-decoration: line-through; }
.check-desc{ font-size:12.5px; opacity:0.78; line-height:1.45; white-space: pre-line; }

/* search results view */
.search-results-head{ margin-bottom:16px; font-size:13px; opacity:0.7; }
.tag-pill{
  display:inline-block;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  background: var(--green);
  color: var(--cream);
  padding:2px 9px;
  border-radius:999px;
  margin-bottom:8px;
}

/* ===== MODAL ===== */
.modal-backdrop{
  position:fixed; inset:0;
  background: rgba(20,15,8,0.55);
  display:flex; align-items:center; justify-content:center;
  z-index: 200;
  padding: 20px;
}
.modal{
  background: var(--bg-soft);
  border-radius: 14px;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y:auto;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  border: 1.5px solid var(--line);
}
.modal h2{
  font-family:'Bricolage Grotesque',sans-serif;
  margin:0 0 16px 0;
  font-size:18px;
  color: var(--rust-dark);
}
.field{ margin-bottom:14px; }
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color: var(--green-dark);
  margin-bottom:5px;
}
.field input, .field textarea, .field select{
  width:100%;
  font-family:'Work Sans',sans-serif;
  font-size:14px;
  padding:9px 11px;
  border-radius:8px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline:none;
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--rust); }
.field textarea{ resize:vertical; min-height:80px; font-family:inherit; }
.checkbox-row{ display:flex; align-items:center; gap:8px; }
.checkbox-row input{ width:auto; }
.checkbox-row label{ margin:0; text-transform:none; font-weight:500; font-size:13px; color: var(--ink); }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 18px; }
.btn-cancel{ background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-save{ background: var(--rust); color: var(--cream); }
.btn-save:hover{ background: var(--rust-dark); }

footer.app-footer{
  text-align:center;
  font-size:12px;
  color: var(--ink);
  opacity:0.55;
  padding: 10px 20px 26px;
}


/* ===== LOGIN / LOADING ===== */
#appLoading{position:fixed;inset:0;background:var(--cover);display:flex;align-items:center;justify-content:center;z-index:9998;color:var(--cream);font-family:'Bricolage Grotesque',sans-serif;font-size:18px;gap:14px;flex-direction:column;}
#appLoading.hidden{display:none;}
.spinner{width:28px;height:28px;border:3px solid rgba(243,234,210,0.25);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loginOverlay{position:fixed;inset:0;background:var(--cover);background-image:linear-gradient(135deg,var(--cover-soft),var(--cover));display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
#loginOverlay.hidden{display:none;}
.login-card{background:var(--bg-soft);border-radius:18px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,0.5);border:1.5px solid var(--line);text-align:center;}
.login-card img{height:72px;width:auto;margin-bottom:22px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25));}
.login-card h2{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;color:var(--rust-dark);margin:0 0 4px 0;}
.login-subtitle{font-size:13px;color:var(--ink);opacity:0.6;margin-bottom:28px;}
.login-field{text-align:left;margin-bottom:14px;}
.login-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--green-dark);margin-bottom:5px;}
.login-field input{width:100%;font-family:'Work Sans',sans-serif;font-size:14px;padding:11px 13px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;}
.login-field input:focus{border-color:var(--rust);}
.login-error{font-size:13px;color:var(--rust-dark);margin-top:10px;min-height:20px;font-weight:500;}
.login-info{font-size:13px;color:var(--green-dark);margin-top:4px;min-height:20px;font-weight:500;}
.login-forgot{display:block;width:100%;text-align:right;font-size:12px;color:var(--green-dark);margin:-6px 0 12px 0;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:'Work Sans',sans-serif;}
.login-forgot:hover{color:var(--rust-dark);}
.login-forgot:disabled{opacity:0.6;cursor:not-allowed;}
.login-btn{width:100%;background:var(--rust);color:var(--cream);font-family:'Work Sans',sans-serif;font-weight:700;font-size:14px;border:none;border-radius:999px;padding:13px;cursor:pointer;margin-top:6px;transition:background .15s;}
.login-btn:hover{background:var(--rust-dark);}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;}
/* user badge */
.user-badge{display:flex;align-items:center;gap:8px;color:var(--cream);font-size:13px;font-weight:600;}
.user-avatar{width:30px;height:30px;background:var(--rust);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:700;color:var(--cream);flex:0 0 auto;}
.admin-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;background:var(--gold);color:var(--cover);padding:2px 7px;border-radius:999px;}
.btn-logout{background:transparent;color:rgba(243,234,210,0.6);border:1.5px solid rgba(243,234,210,0.25);font-family:'Work Sans',sans-serif;font-size:12px;font-weight:600;border-radius:999px;padding:6px 12px;cursor:pointer;}
.btn-logout:hover{border-color:rgba(243,234,210,0.6);color:var(--cream);}
/* mural */
.mural-compose{background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
.mural-compose textarea{width:100%;font-family:'Work Sans',sans-serif;font-size:14px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg-soft);color:var(--ink);resize:vertical;min-height:80px;outline:none;margin-bottom:10px;}
.mural-compose textarea:focus{border-color:var(--rust);}
.mural-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-pill{font-size:12px;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;background:transparent;color:var(--ink);font-family:'Work Sans',sans-serif;transition:all .12s;}
.filter-pill.active{background:var(--rust);color:var(--cream);border-color:var(--rust);}
.mural-list{display:flex;flex-direction:column;gap:12px;}
.aviso-card{background:var(--card);border:1.5px solid var(--line-soft);border-left:5px solid var(--rust);border-radius:var(--radius);padding:14px 16px;}
.aviso-card.resolvido{opacity:0.5;border-left-color:var(--green);background:var(--bg-soft);}
.aviso-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.aviso-author{font-weight:700;font-size:13px;}
.aviso-time{font-size:11px;opacity:0.65;}
.aviso-turno-pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;padding:2px 8px;border-radius:999px;}
.turno-manha{background:#FFF3CD;color:#856404;}
.turno-noite{background:#D1ECF1;color:#0c5460;}
.aviso-texto{font-size:14px;line-height:1.5;white-space:pre-line;margin-bottom:10px;}
.aviso-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.resolve-btn{font-size:12px;font-weight:600;background:var(--green);color:var(--cream);border:none;border-radius:999px;padding:5px 12px;cursor:pointer;font-family:'Work Sans',sans-serif;display:inline-flex;align-items:center;gap:4px;}
.resolve-btn svg{width:11px;height:11px;}
.resolved-label{font-size:11px;color:var(--green-dark);font-weight:600;display:flex;align-items:center;gap:4px;}
.mural-empty{text-align:center;padding:40px 20px;font-size:14px;opacity:0.55;}

/* ===== PÁGINA INICIAL ===== */
.home-wrap{max-width:780px;margin:0 auto;padding:8px 0 40px;}
.home-hero{text-align:center;padding:40px 24px 32px;border-radius:var(--radius);background:linear-gradient(135deg,var(--cover) 0%,#5c3d20 100%);color:var(--cream);margin-bottom:28px;position:relative;overflow:hidden;}
.home-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none;}
.home-hero::after{content:'';position:absolute;bottom:-60px;left:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none;}
.home-hero-title{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;line-height:1.15;}
.home-hero-sub{font-size:14px;opacity:.75;max-width:420px;margin:0 auto 20px;line-height:1.5;}
.home-hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;letter-spacing:.04em;}
.home-sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:28px;}
.home-section-card{background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.home-section-card:hover{border-color:var(--rust);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.home-section-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.home-section-icon svg{width:18px;height:18px;}
.home-section-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:3px;}
.home-section-desc{font-size:11.5px;color:var(--text-muted);line-height:1.4;}
.home-faq{background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;margin-bottom:28px;}
.home-faq-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14px;padding:14px 18px;border-bottom:1px solid var(--line-soft);color:var(--ink);}
.home-faq-item{padding:14px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
.home-faq-item:last-child{border-bottom:none;}
.home-faq-q{font-weight:700;font-size:13px;color:var(--rust-dark);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.home-faq-a{font-size:13px;color:var(--ink);line-height:1.55;display:none;}
.home-faq-item.open .home-faq-a{display:block;}
.home-faq-item.open .home-faq-chevron{transform:rotate(180deg);}
.home-faq-chevron{transition:transform .2s;opacity:.5;flex-shrink:0;margin-left:auto;}
.home-motivacao{background:linear-gradient(135deg,#f5efe4,#ede4d3);border:2px solid var(--gold);border-radius:var(--radius);padding:28px 28px 24px;text-align:center;margin-bottom:8px;}
.home-motivacao-quote{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700;color:var(--cover);line-height:1.4;margin-bottom:12px;}
.home-motivacao-author{font-size:12px;font-weight:600;color:var(--rust);text-transform:uppercase;letter-spacing:.08em;}
.home-how{background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--radius);padding:20px;margin-bottom:28px;}
.home-how-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14px;color:var(--ink);margin-bottom:14px;}
.home-how-steps{display:flex;flex-direction:column;gap:10px;}
.home-how-step{display:flex;align-items:flex-start;gap:12px;}
.home-step-num{width:26px;height:26px;border-radius:50%;background:var(--rust);color:var(--cream);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.home-step-text{font-size:13px;line-height:1.5;color:var(--ink);}

.oc-chale{font-size:11px;font-weight:600;color:var(--green-dark);}
.oc-texto{font-size:13.5px;line-height:1.5;white-space:pre-line;margin-bottom:8px;}

/* ===== AGENDA ===== */
.agenda-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPassword').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginError');
  if(!email||!pass){ err.textContent='Preencha e-mail e senha.'; return; }
  btn.disabled=true; btn.textContent='Entrando...'; err.textContent='';
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{
    btn.disabled=false; btn.textContent='Entrar';
    const msgs={'auth/user-not-found':'E-mail não cadastrado.','auth/wrong-password':'Senha incorreta.',
      'auth/invalid-email':'E-mail inválido.','auth/invalid-credential':'E-mail ou senha incorretos.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde um momento.'};
    err.textContent=msgs[e.code]||'Erro ao entrar. Tente novamente.';
  });
}
function sendPasswordReset(){
  const emailField = document.getElementById('loginEmail');
  const email = emailField ? emailField.value.trim() : '';
  const err = document.getElementById('loginError');
  const info = document.getElementById('loginInfo');
  const btn = document.querySelector('.login-forgot');
  if(err) err.textContent='';
  if(info) info.textContent='';
  if(!email){
    if(err) err.textContent='Digite seu e-mail acima e clique em "Esqueci minha senha" de novo.';
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent='Enviando...'; }
  auth.sendPasswordResetEmail(email).then(()=>{
    if(info) info.textContent='E-mail de redefinição enviado para '+email+'. Verifique a caixa de entrada (e o spam).';
  }).catch(e=>{
    const msgs={'auth/user-not-found':'E-mail não cadastrado.','auth/invalid-email':'E-mail inválido.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde um momento e tente de novo.'};
    if(err) err.textContent = msgs[e.code] || 'Não foi possível enviar o e-mail de redefinição. Tente novamente.';
  }).finally(()=>{
    if(btn){ btn.disabled=false; btn.textContent='Esqueci minha senha'; }
  });
}

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function subscribeToChecklist(){
  if(unsubscribeChecklist) unsubscribeChecklist();
  unsubscribeChecklist=db.collection('checklistLazer').doc(todayStr()).onSnapshot(snap=>{
    firestoreChecklist=snap.exists?(snap.data()||{}):{};
    if(activeTab==='rotinas') renderMain();
  });
}
function isItemChecked(id,turno){
  return !!(firestoreChecklist[turno+'_'+id]&&firestoreChecklist[turno+'_'+id].checked);
}
async function toggleChecklistItem(id){
  if(!currentUser) return;
  const entry=entries.find(e=>e.id===id);
  if(!entry) return;
  const key=entry.turno+'_'+id;
  const docRef=db.collection('checklistLazer').doc(todayStr());
  if(firestoreChecklist[key]&&firestoreChecklist[key].checked){
    await docRef.set({[key]:firebase.firestore.FieldValue.delete()},{merge:true});
  } else {
    await docRef.set({[key]:{checked:true,by:currentUser.name,at:new Date().toISOString()}},{merge:true});
  }
}
async function resetChecklist(turno){
  if(!confirm('Reiniciar checklist deste turno?')) return;
  const updates={};
  entries.filter(e=>e.categoria==='rotinas'&&e.turno===turno).forEach(e=>{
    updates[turno+'_'+e.id]=firebase.firestore.FieldValue.delete();
  });
  await db.collection('checklistLazer').doc(todayStr()).set(updates,{merge:true});
}
function turnoProgress(turno){
  const list=entries.filter(e=>e.categoria==='rotinas'&&e.turno===turno);
  const done=list.filter(e=>isItemChecked(e.id,turno)).length;
  return{done,total:list.length};
}

function formatarTempo(ts){
  if(!ts||!ts.toDate) return '';
  const d=ts.toDate();
  const now=new Date();
  const diffMs=now-d;
  const diffMin=Math.floor(diffMs/60000);
  if(diffMin<1) return 'agora mesmo';
  if(diffMin<60) return diffMin+'min atrás';
  const diffH=Math.floor(diffMin/60);
  if(diffH<24) return diffH+'h atrás';
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function dataParaStr(d){

/* --- Ocorrências Firestore (coleção própria: ocorrenciasLazer) --- */
let ocorrencias = [];
let ocorrenciaFiltroData = null; // null = hoje
let ocorrenciaFiltroStatus = 'todos'; // todos | Aberto | Em andamento | Resolvido
let ocorrenciasHistoricoCompleto = false;
let unsubOcRecentes = null, unsubOcAbertas = null;
let ocDocsRecentes = {}, ocDocsAbertas = {};

const TIPOS_OC = ['Pendência','Informação','Incidente / Segurança','Manutenção de equipamento'];
const STATUS_OC = ['Aberto','Em andamento','Resolvido'];

function mergeOcorrencias(){
  const merged = {...ocDocsRecentes, ...ocDocsAbertas};
  ocorrencias = Object.values(merged).sort((a,b)=>{
    const ta = (a.criadoEm && a.criadoEm.toMillis) ? a.criadoEm.toMillis() : 0;
    const tb = (b.criadoEm && b.criadoEm.toMillis) ? b.criadoEm.toMillis() : 0;
    return tb - ta;
  });
  if(activeTab==='ocorrencias') renderMain();
}

function subscribeToOcorrencias(){
  if(unsubOcRecentes) unsubOcRecentes();
  if(unsubOcAbertas) unsubOcAbertas();

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (ocorrenciasHistoricoCompleto ? 3650 : 90));
  const cutoffTs = firebase.firestore.Timestamp.fromDate(cutoff);

  unsubOcRecentes = db.collection('ocorrenciasLazer')
    .where('criadoEm','>=',cutoffTs)
    .orderBy('criadoEm','desc')
    .onSnapshot(snap=>{
      ocDocsRecentes = {};
      snap.docs.forEach(d=>{ ocDocsRecentes[d.id] = {id:d.id,...d.data()}; });
      mergeOcorrencias();
    }, err=>console.error('Ocorrências (recentes):',err));

  unsubOcAbertas = db.collection('ocorrenciasLazer')
    .where('status','in',['Aberto','Em andamento'])
    .onSnapshot(snap=>{
      ocDocsAbertas = {};
      snap.docs.forEach(d=>{ ocDocsAbertas[d.id] = {id:d.id,...d.data()}; });
      mergeOcorrencias();
    }, err=>console.error('Ocorrências (abertas):',err));
}

function toggleHistoricoOcorrencias(){
  ocorrenciasHistoricoCompleto = !ocorrenciasHistoricoCompleto;
  subscribeToOcorrencias();
}

    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Não foi possível abrir a imagem.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if(height >= width && height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const OC_MAX_FOTOS = 3;
const OC_MAX_BYTES_TOTAL = 900000; // ~900KB de folga dentro do limite de 1MB por documento

async function compressOcorrenciaFotos(fileList){
  const files = Array.from(fileList).slice(0, OC_MAX_FOTOS);
  const fotos = [];
  for(const file of files){
    let quality = 0.55, maxDim = 900, dataUrl = await compressImageToDataURL(file, maxDim, quality);
    if(dataUrl.length > OC_MAX_BYTES_TOTAL / OC_MAX_FOTOS){
      dataUrl = await compressImageToDataURL(file, 650, 0.4);
    }
    fotos.push(dataUrl);
  }
  const totalSize = fotos.reduce((sum,f)=>sum+f.length, 0);
  if(totalSize > OC_MAX_BYTES_TOTAL){
    throw new Error('As fotos selecionadas são muito grandes, mesmo comprimidas. Tente selecionar menos fotos ou fotos com resolução menor.');
  }
  return fotos;
}

async function salvarOcorrencia(){
  const tipo  = document.getElementById('oc-tipo')?.value;
  const texto = document.getElementById('oc-texto')?.value.trim();
  const local = document.getElementById('oc-local')?.value.trim();
  const fotoInput = document.getElementById('oc-fotos');
  const files = (fotoInput && fotoInput.files) ? fotoInput.files : [];
  if(!tipo||!texto){ alert('Preencha o tipo e o texto.'); return; }
  const btn = document.getElementById('oc-btn');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  const turnoAtual = new Date().getHours()<15?'manha':'tarde';
  try{
    let fotos = [];
    if(files.length){
      if(btn) btn.textContent = 'Comprimindo fotos...';
      fotos = await compressOcorrenciaFotos(files);
    }
    await db.collection('ocorrenciasLazer').add({
      tipo, texto, local:local||'', fotos,
      turno:turnoAtual, autorNome:currentUser.name, autorEmail:currentUser.email,
      status:'Aberto',
      data: dataParaStr(new Date()),
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('oc-tipo').value='';
    document.getElementById('oc-texto').value='';
    if(document.getElementById('oc-local')) document.getElementById('oc-local').value='';
    if(fotoInput) fotoInput.value='';
    const preview = document.getElementById('oc-fotos-preview');
    if(preview) preview.innerHTML='';
  }catch(e){
    alert(e && e.message ? e.message : 'Erro ao salvar. Verifique sua conexão e tente novamente.');
    console.error(e);
  }
  if(btn){btn.disabled=false;btn.innerHTML=icon('clipbook')+' Registrar';}
}

// ── Drag & Drop reordering (admin only) ───────────────────────────────
let dragSrcId = null;

function onDragStart(e, id){
  dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(()=>{ const el = document.querySelector(`[data-id="${id}"]`); if(el) el.classList.add('dragging'); }, 0);
}
function onDragEnd(e){
  document.querySelectorAll('.entry-card, .drop-zone').forEach(c=>c.classList.remove('dragging','drag-over','drop-zone-active'));
}
function onDragOver(e, id){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(id === dragSrcId) return;
  document.querySelectorAll('.entry-card').forEach(c=>c.classList.remove('drag-over'));
  const el = document.querySelector(`[data-id="${id}"]`);
  if(el) el.classList.add('drag-over');
}
function onDragOverZone(e, catKey){
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('drop-zone-active'));
  const el = document.querySelector(`[data-zone="${catKey}"]`);
  if(el) el.classList.add('drop-zone-active');
}
function onDropZone(e, catKey){
  e.preventDefault();
  document.querySelectorAll('.entry-card, .drop-zone').forEach(c=>c.classList.remove('dragging','drag-over','drop-zone-active'));
  if(!dragSrcId) return;
  const all = [...entries];
  const srcIdx = all.findIndex(x=>x.id===dragSrcId);
  if(srcIdx<0) return;
  all[srcIdx] = {...all[srcIdx], categoria: catKey};
  const [moved] = all.splice(srcIdx,1);
  let insertAt = all.length;
  for(let i=all.length-1;i>=0;i--){ if(all[i].categoria===catKey){ insertAt=i+1; break; } }
  all.splice(insertAt,0,moved);
  entries = all;
  saveData();
  render();
}
function onDrop(e, targetId){
  e.preventDefault();
  document.querySelectorAll('.entry-card, .drop-zone').forEach(c=>c.classList.remove('drag-over','dragging','drop-zone-active'));
  if(!dragSrcId || dragSrcId === targetId) return;
  const all = [...entries];
  const srcIdx = all.findIndex(x=>x.id===dragSrcId);
  const tgtIdx = all.findIndex(x=>x.id===targetId);
  if(srcIdx<0||tgtIdx<0) return;
  const targetCat = all[tgtIdx].categoria;
  const [moved] = all.splice(srcIdx,1);
  moved.categoria = targetCat;
  const newTgtIdx = all.findIndex(x=>x.id===targetId);
  all.splice(newTgtIdx,0,moved);
  entries = all;
  saveData();
  render();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function dataURLtoBlobURL(dataUrl){
  const [meta, b64] = dataUrl.split(',');
  const mimeMatch = meta.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const byteChars = atob(b64);
  const byteNumbers = new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], {type: mime});
  return URL.createObjectURL(blob);
}

function abrirAnexo(id){
  const e = entries.find(x=>x.id===id);
  if(!e || !e.anexoData) return;
  try{
    const blobUrl = dataURLtoBlobURL(e.anexoData);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(blobUrl), 60000);
  }catch(err){
    console.error('Erro ao abrir anexo:', err);
    alert('Não foi possível abrir o anexo neste navegador.');
  }
}

}
function render(){
  renderTabs();
  renderMain();
  const editBtn = document.getElementById('editToggleBtn');
  const editLabel = document.getElementById('editToggleLabel');
  editBtn.classList.toggle('active', isEditMode);
  editLabel.textContent = isEditMode ? 'Editando…' : 'Modo edição';
  document.getElementById('resetDefaultBtn').style.display = isEditMode ? 'inline-flex' : 'none';
}

/* ============ SEARCH ============ */
document.getElementById('searchInput').addEventListener('input', (ev)=>{
  searchTerm = ev.target.value;
  renderTabs();
  renderMain();
});

/* ============ EDIT MODE ============ */
function toggleEditMode(){
  if(!currentUser||currentUser.role!=='admin'){alert('Apenas a líder pode editar o conteúdo.');return;}
  isEditMode=!isEditMode;
  render();
}

/* ============ MODAL: ADD / EDIT ============ */
function openAddModal(categoria, turno){
  showModal({
    title: 'Adicionar item',
    categoria: categoria,
    turno: turno || '',
    titulo:'', subtitulo:'', corpo:'', destaque:false,
    isNew: true
  });
}
function openEditModal(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  showModal({ title:'Editar item', ...e, isNew:false });
}
let removeAttachmentFlag = false;

function showModal(data){
  removeAttachmentFlag = false;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${data.title}</h2>
        <div class="field">
          <label>Título</label>
          <input id="f-titulo" type="text" value="${escapeAttr(data.titulo)}" placeholder="Ex: Trilha do Mirante">
        </div>
        <div class="field">
          <label>Subtítulo (opcional — valor, duração, horário...)</label>
          <input id="f-subtitulo" type="text" value="${escapeAttr(data.subtitulo||'')}" placeholder="Ex: R$ 50,00 + 10% · Saída 10h">
        </div>
        <div class="field">
          <label>Descrição</label>
          <textarea id="f-corpo" placeholder="Explique a atividade, procedimento, regra ou detalhe...">${escapeHtml(data.corpo||'')}</textarea>
        </div>
        <div class="field">
          <label>Anexar PDF (opcional — ex: mapa de trilha, lista de materiais)</label>
          ${data.anexoNome ? `<div class="current-attachment" id="currentAttachment" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;">${icon('paperclip')} ${escapeHtml(data.anexoNome)} <button type="button" class="mini-btn mini-del" onclick="document.getElementById('currentAttachment').style.display='none'; removeAttachmentFlag=true;">Remover</button></div>` : ''}
          <input id="f-anexo" type="file" accept="application/pdf">
        </div>
        <div class="field checkbox-row">
          <input id="f-destaque" type="checkbox" ${data.destaque?'checked':''}>
          <label for="f-destaque">Marcar como aviso importante (aparece destacado no topo da seção)</label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-save" id="modalSaveBtn" onclick="saveModal('${data.isNew ? '' : data.id}','${data.categoria}','${data.turno||''}')">Salvar</button>
        </div>
      </div>
    </div>
  `;
}
function escapeAttr(str){ return (str||'').replace(/"/g,'&quot;'); }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveModal(id, categoria, turno){
  const titulo = document.getElementById('f-titulo').value.trim();
  const subtitulo = document.getElementById('f-subtitulo').value.trim();
  const corpo = document.getElementById('f-corpo').value.trim();
  const destaqueEl = document.getElementById('f-destaque');
  const destaque = destaqueEl ? destaqueEl.checked : false;

  if(!titulo){ alert('Por favor, preencha o título.'); return; }

  const existing = id ? entries.find(x=>x.id===id) : null;
  let anexoData = (existing && !removeAttachmentFlag) ? existing.anexoData : null;
  let anexoNome = (existing && !removeAttachmentFlag) ? existing.anexoNome : null;

  const fileInput = document.getElementById('f-anexo');
  if(fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    if(file.size > 4*1024*1024){
      if(!confirm('Esse arquivo é grande ('+Math.round(file.size/1024/1024)+'MB) e pode não salvar corretamente neste navegador. Continuar mesmo assim?')) return;
    }
    const saveBtn = document.getElementById('modalSaveBtn');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Lendo arquivo...'; }
    try{
      anexoData = await readFileAsDataURL(file);
      anexoNome = file.name;
    }catch(e){
      alert('Não foi possível ler o arquivo selecionado.');
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Salvar'; }
      return;
    }
  }

  if(id){
    const e = entries.find(x=>x.id===id);
    if(e){ e.titulo=titulo; e.subtitulo=subtitulo; e.corpo=corpo; e.destaque=destaque; e.anexoData=anexoData; e.anexoNome=anexoNome; }
  } else {
    const newEntry = {
      id: 'e-' + Date.now() + '-' + Math.floor(Math.random()*1000),
      categoria, titulo, subtitulo, corpo, destaque, anexoData, anexoNome
    };
    if(turno) newEntry.turno = turno;
    entries.push(newEntry);
  }
  saveData();
  closeModal();
  render();
}
function deleteEntry(id){
  if(!confirm('Excluir este item do glossário?')) return;
  entries = entries.filter(e=>e.id!==id);
  saveData();
  render();
}

/* ============ INIT ============ */
